version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: farmacias_db
    environment:
      POSTGRES_DB: farmacias_db
      POSTGRES_USER: farmacia_user
      POSTGRES_PASSWORD: SecurePass2024!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farmacias_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacia_user -d farmacias_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # API FastAPI
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: farmacias_api
    environment:
      DATABASE_URL: postgresql://farmacia_user:SecurePass2024!@postgres:5432/farmacias_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - farmacias_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: farmacias_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/farmacias-api.conf:/etc/nginx/sites-available/default
    depends_on:
      - api
    networks:
      - farmacias_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  farmacias_network:
    driver: bridge
